<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkMark</title>

  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WorkMark" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
  <div class="brand">
    <div class="logo">✓</div>
    <div>
      <h1>WorkMark</h1>
      <p>Твой простой календарь рабочих дней</p>
    </div>
  </div>

  <button id="themeToggle" class="theme-btn">🌙</button>
</header>

    <section class="stats">
      <article class="stat-card">
        <span>Всего отмечено</span>
        <strong id="totalCount">0</strong><small>дней</small>
      </article>
      <article class="stat-card">
        <span>В этом месяце</span>
        <strong id="monthCount">0</strong><small>дней</small>
      </article>
      <article class="stat-card">
        <span>Текущая серия</span>
        <strong id="streakCount">0</strong><small>дней</small>
      </article>
      <article class="stat-card">
        <span>Заработано за месяц</span>
        <strong id="salaryCount">0</strong><small>сом</small>
      </article>
    </section>

    <section class="layout">
      <div class="panel calendar-panel">
        <div class="calendar-header">
          <button class="nav-btn" id="prevMonth" aria-label="Предыдущий месяц">‹</button>
          <div class="calendar-title">
            <h2 id="monthTitle"></h2>
            <button id="todayBtn">Вернуться к сегодняшнему дню</button>
          </div>
          <button class="nav-btn" id="nextMonth" aria-label="Следующий месяц">›</button>
        </div>

        <div class="weekdays">
          <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>
      </div>

      <aside class="panel side-panel">
        <h3>Выбранный день</h3>
        <div class="selected-date" id="selectedDateText"></div>

        <div class="status-box">
          <div class="status-label">Статус</div>
          <div class="status-value" id="statusValue">Не отмечен</div>
        </div>

        <button class="mark-btn" id="toggleBtn">Отметить как рабочий</button>

        <p class="hint">
          Нажимай на любой прошедший день в календаре. Данные сохраняются прямо в этом браузере.
        </p>
      </aside>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  

  

<script src="script.js"></script>
</body>
</html>
